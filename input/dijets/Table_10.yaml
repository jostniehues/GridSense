# CMS dijet cross section, HEPData ins1208923, Table 10.
# Observable: d^2 sigma / (d m_jj d y_max) [pb/GeV], 2.0 <= y_max < 2.5.
# Diagonal approximation: the table-level stat and total sys errors are treated
# as bin-wise uncorrelated. Asymmetric sys errors are symmetrized by averaging
# the magnitudes of their upward and downward variations.

bins:
  - ranges: { m_jj: { low: 1000.0, high: 1246.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 4.98
  - ranges: { m_jj: { low: 1246.0, high: 1530.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 1.18
  - ranges: { m_jj: { low: 1530.0, high: 1856.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 0.304
  - ranges: { m_jj: { low: 1856.0, high: 2231.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 0.0627
  - ranges: { m_jj: { low: 2231.0, high: 2659.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 0.0077
  - ranges: { m_jj: { low: 2659.0, high: 3147.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 0.00247
  - ranges: { m_jj: { low: 3147.0, high: 3704.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 0.000628
  - ranges: { m_jj: { low: 3704.0, high: 5058.0 }, y_max: { low: 2.0, high: 2.5 } }
    value: 1.21e-05

uncertainties:
  - name: "stat"
    kind: "uncorrelated"
    unit: "absolute"
    per_bin: [0.292, 0.129, 0.0366, 0.0112, 0.00337, 0.000955, 0.000137, 1.25e-05]

  - name: "sys"
    kind: "uncorrelated"
    unit: "absolute"
    per_bin: [0.686, 0.1695, 0.0444, 0.010125, 0.001325, 0.0005315, 0.0001715, 6.845e-06]
